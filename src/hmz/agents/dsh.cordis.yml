# The SDK's bundled headless composition, with humanize's per-session effort and
# durable uncompressed logs added. The runtime still owns and validates every plugin.
- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'

- id: agent-core
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    workspaceContext:
      maxBytes: 65536
    # The official persisted goal service, model tools and same-session round driver.
    goals: {}

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    reasoningEffort: !!js process.env.HMZ_DSH_EFFORT

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'
    compression: none

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

# What the conversation is costing the context window, and what to do once it is nearly
# full. Without these a session that runs long enough is a session the model refuses for
# length -- which is where a loop that opens no new conversation stops for good, since the
# next turn is the same conversation and the same refusal. The threshold is the plugin's
# own default, written out because it is the number this is about.
- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    auto: true

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
