[project]
name = "amflows"
version = "0.1.0"
description = "Orchestrate, execute, and observe agent flows"
readme = "README.md"
authors = [
    { name = "Zijian Zhang", email = "35801754+futrime@users.noreply.github.com" }
]
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "dateparser>=1.4.1",
]

[project.scripts]
coganchor = "amflows.coganchor.cli:main"
exomyth = "amflows.exomyth.cli:main"
janus = "amflows.janus.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
]
