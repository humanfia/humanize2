[project]
name = "humanize"
version = "0.1.0"
description = "Orchestrate, execute, and observe agent flows"
readme = "README.md"
authors = [
    { name = "Zijian Zhang", email = "35801754+futrime@users.noreply.github.com" }
]
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "dateparser>=1.4.1",
    "pyfiglet>=1.0",
    "pyyaml>=6.0.3",
    "textual>=8.2.8",
]

[project.scripts]
hmz = "humanize.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
# The interface is an async application, and its tests drive it as one.
asyncio_mode = "auto"
