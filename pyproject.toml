[project]
name = "hmz"
version = "0.1.0"
description = "Orchestrate, execute, and observe agent flows"
readme = "README.md"
authors = [
    { name = "Zijian Zhang", email = "35801754+futrime@users.noreply.github.com" }
]
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "dateparser>=1.4.2",
    # DeepSeek Harness is driven through its own Python SDK, which also brings the runtime
    # its turns are taken on. An ordinary dependency rather than an extra: a backend humanize
    # drives is not a thing an install should be able to have half of.
    "deepseek-harness-sdk>=0.1.1rc1,<0.2",
    # A flow says what it can be configured with by declaring a model, and the menu that
    # asks is read off that model: the types, the bounds and the combinations a flow
    # refuses are all written once, where the flow declares them.
    "psutil>=7.2.2",
    "pydantic>=2.13.5",
    "pyfiglet>=1.0",
    # dsh reads a project's `.env` the way its own CLI does, and reading one is somebody
    # else's solved problem.
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    # Named because the interface imports it directly. It arrives with textual either
    # way, but a dependency you import is one you declare.
    "rich>=15",
    # What a crash is reported through, for as long as humanize is early enough that a
    # stack nobody sees is a bug nobody fixes. Off until somebody says otherwise, and an
    # ordinary dependency rather than an extra: an install that could be missing the half
    # that reports its own failures is an install whose failures are not reported.
    "sentry-sdk>=2.68.1",
    "textual>=8.2.8",
]

[project.urls]
Homepage = "https://github.com/humanfia/humanize2"
Repository = "https://github.com/humanfia/humanize2"
Issues = "https://github.com/humanfia/humanize2/issues"

[project.scripts]
hmz = "hmz.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyright>=1.1.411",
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6",
    "pytest-timeout>=2.3",
    # Exercises dsh's dotenv-compatible native configuration without making the SDK
    # itself part of every development environment.
    "python-dotenv>=1.2.3",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
# The interface is an async application, and its tests drive it as one.
asyncio_mode = "auto"
# A marker nobody registered is a typo, and a typo in `-m` selects nothing.
# `-ra` names what was skipped, so a test that quietly stops running says so.
addopts = ["--strict-markers", "--strict-config", "-ra"]

[tool.ruff]
# The formatter wraps at 88; `pycodestyle` below lets prose the formatter cannot
# split run to 100 rather than forcing a reflow of every docstring in the tree.
line-length = 88

[tool.ruff.lint]
# Everything, less what this codebase has a reason to be without. A rule is off
# here only where it argues with something the code does on purpose.
select = ["ALL"]
# The prompt glyph the interface draws, and the sign that means times.
allowed-confusables = ["❯", "×"]
ignore = [
    # The formatter owns trailing commas and implicit concatenation; linting them
    # too makes the two tools rewrite each other's lines.
    "COM812",
    "ISC001",
    # LICENSE says it once. A header per file says it a hundred and twenty times.
    "CPY001",
    # Google style documents a class where it is declared and leaves the class
    # docstring to cover __init__, dunders, and the one-line accessors.
    "D102",
    "D105",
    "D107",
    # Each subcommand imports what only it needs, so `hmz` starts without loading
    # the interface, the tracer, and the sandbox to run a command that uses none.
    "PLC0415",
    # `Any` is what a wire protocol carries. Pyright's strict mode governs the rest.
    "ANN401",
    # Between them these want an exception class per message. The messages are
    # one-offs and read better at the raise than three files away.
    "TRY003",
    "EM101",
    "EM102",
    # Every subprocess here is an argv list, never a shell string, and looking up
    # `ssh` or `docker` on PATH is the point rather than the oversight.
    "S603",
    "S607",
    # The counters. A reader of somebody else's stream format is one `match` over
    # the items that format has, and a launch takes what `execve` takes; splitting
    # either to bring a number down hides the shape of the thing being mirrored.
    # Set `mccabe.max-complexity` and the `pylint` maxima to put a ceiling back.
    "C901",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
]

[tool.ruff.lint.per-file-ignores]
# The script that builds the throwaway world the documentation's terminal demos are
# recorded in. It is copied into a container and run by path rather than imported, so it
# is a file rather than a package, and there is nothing for an `__init__.py` to do.
"docs/tapes/stage.py" = ["INP001"]
# The concurrency rig, for the same reason: each script is run by path inside the cgroup
# being measured rather than imported, so there is nothing for an `__init__.py` to do. And
# what a measurement writes, it prints -- the ladder reads one JSON object per run off
# their stdout, and the summary is a table.
"bench/**" = ["INP001", "T201"]
# The syscall layer's domain type is the string path: it reads them out of ptrace
# registers and puts them on a wire, so `pathlib` would only convert them twice.
"src/hmz/coganchor/**" = ["PTH"]
# The same, for the half of a redirected run that reads paths out of a tracee: what
# it holds is what the process itself named, byte for byte, and back again.
"src/hmz/providers/_trace.py" = ["PTH"]
# A handle and the client it came off, a session and its agent: each pair is two
# halves of one object declared in one file, and the underscore keeps the halves
# out of the package's public surface rather than out of each other's.
"src/hmz/coganchor/remote.py" = ["SLF001"]
"src/hmz/agents/base.py" = ["SLF001"]
"src/hmz/agents/codex.py" = ["SLF001"]
"src/hmz/agents/dsh.py" = ["SLF001"]
"src/hmz/agents/kimi.py" = ["SLF001"]
"src/hmz/agents/zcode.py" = ["SLF001"]
# Looking for a flow is allowed to find nothing. `os.path` answers False for a
# directory it cannot read, and for a `~` with no home behind it, where `Path` raises;
# both modules say so where they reach for one -- `find` here, `_own` there.
"src/hmz/flows/__init__.py" = ["PTH"]
"src/hmz/flows/verses.py" = ["PTH"]
# A flow is a directory whose `__init__.py` holds its entry points, and that module's
# docstring is about them -- how the flow loops, what each agent is for, and the line
# that starts it. What a flow prints is what it says: the interface captures everything
# printed under it into the transcript, so a warning a flow has to give is a `print`.
"src/hmz/flows/builtin/**" = ["D103", "T201"]
# What a command line writes, it prints.
"src/hmz/cli/**" = ["T201"]
"tests/**" = [
    "S101",    # an assert is what a test is
    "SLF001",  # a test reaches for what it tests, private or not
    "PLR2004", # the literal a test compares against is the expectation
    "D1",      # the name of a test is what it documents
    "ARG",     # pytest passes a fixture by name, whether the body names it or not
    "FBT",     # a parametrized test takes its parameters however `parametrize` gives them
    "S105",    # a fake credential
    "S106",
    "S108",    # and a fake temp path
]

[tool.ruff.lint.pycodestyle]
max-line-length = 100

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
# The only checker here is pyright, so a suppression names a pyright rule.
# `# type: ignore[whatever]` silences the whole line whatever is in the brackets.
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"

# A test reaches for what it tests, private or not, which is the one thing it may
# do that its subject's callers may not. The root goes back on the path because a
# test names its fixtures from the top: `tests.coganchor.conftest`.
[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportPrivateUsage = "none"
# An autouse fixture is used by being declared, and nothing names it anywhere.
reportUnusedFunction = "none"
